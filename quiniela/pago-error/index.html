<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago no confirmado | Quiniela Better Mood 2026</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../quiniela.css" />
</head>
<body>
  <main class="q-section">
    <div class="q-container">
      <section class="q-card q-success-card" aria-live="polite">
        <p class="q-eyebrow">Pago no confirmado</p>
        <h1 id="status-title">No pudimos confirmar tu pago</h1>
        <p id="status-copy">Puedes intentar de nuevo o pagar en cafetería.</p>
        <div class="q-inline-actions">
          <a class="q-btn q-btn-primary" href="../#registro">Volver a reservar kit</a>
          <button id="verify-status" class="q-btn q-btn-secondary" type="button">Verificar estado</button>
          <button id="copy-folio" class="q-btn q-btn-secondary" type="button">Copiar folio</button>
        </div>
        <small id="feedback" class="q-feedback"></small>
      </section>
    </div>
  </main>
  <script src="../payment-status.js" type="module"></script>
</body>
</html>
