<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recibimos tu postulación | Better Mood Coffee</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#ffde00" />
    <link rel="icon" href="/assets/bettermood_logo-10.png" />
    <link rel="stylesheet" href="/trabaja-con-nosotros/careers.css?v=20260713-2" />
    <style>
      .thanks { min-height: 100svh; padding: 40px 22px; display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, rgba(255,222,0,.55), transparent 34%), var(--paper); }
      .thanks__inner { width: min(760px,100%); text-align: center; }
      .thanks .brand { width: 92px; margin: 0 auto 44px; }
      .thanks h1 { margin-top: 16px; font-size: clamp(3.2rem,8vw,6.8rem); line-height: .92; letter-spacing: -.065em; }
      .thanks p:not(.eyebrow) { max-width: 570px; margin: 26px auto 0; color: var(--muted); font-size: 1.08rem; line-height: 1.6; }
      .thanks .button { margin-top: 34px; }
    </style>
  </head>
  <body data-careers-success>
    <main class="thanks">
      <div class="thanks__inner">
        <a class="brand" href="/" aria-label="Better Mood Coffee, inicio"><img src="/assets/home/bettermood-logo-180.png" alt="Better Mood Coffee" width="180" height="147" /></a>
        <p class="eyebrow">Postulación recibida</p>
        <h1>Gracias por querer ser parte.</h1>
        <p>Revisaremos tu perfil. Si coincide con una oportunidad disponible, nos pondremos en contacto contigo.</p>
        <a class="button button--primary" href="/">Volver a Better Mood</a>
      </div>
    </main>
    <script src="/trabaja-con-nosotros/careers.js?v=20260713-2" defer></script>
