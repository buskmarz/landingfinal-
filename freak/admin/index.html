<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FREAK · Administración</title><link rel="stylesheet" href="/freak/admin/admin.css"><script type="module" src="/freak/admin/admin.js"></script></head><body><header><a href="/freak/" class="logo">FREAK</a><div><strong>Administración</strong><small>Better Mood · Control de stickers</small></div><label class="campaign">Campaña<select id="campaign"><option value="freak-2026">Colección</option><option value="prueba">Interno</option></select></label><button id="logout" hidden>Cerrar sesión</button></header><main><h1>Stickers</h1><p id="notice" role="status" aria-live="polite"></p><section id="login"><h2>Acceso privado</h2><p></p><form id="login-form"><label>Clave<input name="key" type="password" required autocomplete="current-password"></label><button class="primary">Entrar</button></form></section><div id="dashboard" hidden><nav class="modes" aria-label="Acciones"><button data-mode="place" aria-pressed="true">Colocar</button><button data-mode="receive" aria-pressed="false">Recibir</button><button data-mode="inventory" aria-pressed="false">Inventario</button></nav><section id="identify"><button id="scan-qr" class="primary">Escanear QR</button><div id="scanner" hidden><video id="scan-video" playsinline muted></video><button id="stop-scan">Cerrar cámara</button><p id="scan-status" role="status"></p></div><form id="code-form"><label>Código<input name="code" maxlength="4" minlength="4" required placeholder="AB7K" autocomplete="off" autocapitalize="characters"></label><button>Buscar</button></form></section><details class="overview"><summary>Resumen y exportación</summary><div class="metrics" id="metrics"></div><div class="tools"><button id="refresh">Actualizar</button><button id="export">Descargar CSV</button><span id="updated" class="muted"></span></div></details><section id="receipts" hidden><h2>Recibir</h2><p>Usa su alias. Escanea o escribe el código.</p><form id="receipt-form"><div class="form-grid"><label>Alias<input name="alias" minlength="3" maxlength="24" required></label><label>Código del sticker<input name="code" minlength="4" maxlength="4" placeholder="AB7K" required autocomplete="off"></label></div><button class="primary">Contar sticker</button></form><details><summary>Entregas por persona</summary><div id="receipt-summary"></div></details></section><div class="workspace"><section class="inventory" hidden><div class="filters"><label>Buscar<input id="search" placeholder="Número, artista o lugar"></label><label>Estado físico<select id="physical-filter"><option value="">Todos</option><option value="unplaced">Sin colocar</option><option value="placed">Colocado</option><option value="removed">Retirado</option><option value="missing">No encontrado</option></select></label><label>Actividad<select id="activity-filter"><option value="">Todas</option><option value="unopened">Sin aperturas</option><option value="opened">Enlace abierto</option><option value="claimed">Reclamado</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Sticker</th><th>Ubicación</th><th>Actividad</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="count" class="muted"></p><details><summary>Identificar por enlace QR</summary><form id="lookup-form"><label>Enlace del sticker<input name="url" type="url" required placeholder="Pega el enlace leído por la cámara"></label><button>Encontrar sticker</button></form><p class="muted">Esta consulta administrativa no cuenta como apertura pública.</p></details></section><section id="detail" aria-label="Detalle del sticker"></section></div></div></main></body></html>
