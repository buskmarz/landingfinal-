<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FREAK · Puntos y premios</title><link rel="stylesheet" href="/freak/physical.css"><script type="module" src="/freak/admin/rewards.js"></script></head><body><header><a href="/freak/">FREAK</a><a href="/freak/admin/">Inventario anterior</a></header><main><section><h1 style="font-size:48px">Puntos y premios</h1><p id="notice" role="status" aria-live="polite"></p><form id="login"><label>Clave de administración<input name="key" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><div id="desk" hidden><form id="validate"><h2>Validar stickers</h2><p>La persona debe registrarse primero en FREAK.</p><label>Nombre registrado<input name="name" required maxlength="60"></label><label>Celular<input name="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></label><label>Normales · 1 punto<input name="normal" type="number" min="0" max="5000" step="1" value="0" required></label><label>Especiales · 2 puntos<input name="special" type="number" min="0" max="5000" step="1" value="0" required></label><p id="total">0 puntos</p><label><input name="marked" type="checkbox" style="display:inline;width:auto" required> Revisé y marqué los stickers como contados</label><button>Validar y generar código</button></form><p id="code" role="status"></p><h2>Premios</h2><div id="prizes" class="prizes"></div><h2>Personas validadas</h2><div id="validations"></div><button id="refresh">Actualizar</button><button id="logout">Salir</button></div></section></main></body></html>
