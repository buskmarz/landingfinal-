<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sistema interno | Better Mood Coffee</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ec;
        --ink: #211f1f;
        --muted: #6d6861;
        --line: rgba(33, 31, 31, 0.12);
        --accent: #ffcf19;
        --panel: rgba(255, 255, 255, 0.92);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .system-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        gap: 10px;
      }

      .system-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 18px 45px rgba(33, 31, 31, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        object-fit: contain;
        flex: 0 0 auto;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1px 0 0;
        font-size: clamp(18px, 2.1vw, 24px);
        line-height: 1.05;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .button {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 14px;
        color: var(--ink);
        background: #fff;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
      }

      .button.primary {
        border-color: rgba(33, 31, 31, 0.18);
        background: var(--accent);
      }

      .frame-wrap {
        position: relative;
        flex: 1;
        min-height: 620px;
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        background: #101827;
        box-shadow: 0 18px 45px rgba(33, 31, 31, 0.12);
      }

      .system-frame {
        width: 100%;
        height: 100%;
        min-height: calc(100vh - 96px);
        border: 0;
        display: block;
        background: #101827;
      }

      .fallback {
        position: absolute;
        inset: auto 12px 12px 12px;
        display: none;
        padding: 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.94);
        color: var(--ink);
        box-shadow: 0 14px 34px rgba(33, 31, 31, 0.18);
      }

      @media (max-width: 720px) {
        .system-shell {
          padding: 8px;
        }

        .system-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .actions,
        .button {
          width: 100%;
        }

        .frame-wrap {
          min-height: 78vh;
          border-radius: 14px;
        }

        .system-frame {
          min-height: calc(100vh - 172px);
        }
      }
    </style>
  </head>
  <body>
    <main class="system-shell">
      <header class="system-header">
        <div class="brand">
          <img class="brand-mark" src="/assets/logo-better-mood.png" alt="Better Mood Coffee" />
          <div>
            <p class="eyebrow">Better Mood Coffee</p>
            <h1>Sistema interno</h1>
          </div>
        </div>
        <nav class="actions" aria-label="Accesos del sistema">
          <a class="button" href="/">Landing</a>
          <a class="button primary" href="https://tareascontrol.netlify.app/" rel="noopener">Respaldo directo</a>
        </nav>
      </header>

      <section class="frame-wrap" aria-label="Cafe Ops Task Control" style="display:grid;place-items:center;background:#101827;color:#fff;text-align:center;padding:24px;">
        <div>
          <p class="eyebrow" style="color:#ffcf19;">Acceso operativo</p>
          <h2 style="margin:6px 0 10px;font-size:clamp(24px,4vw,44px);">Sistema interno</h2>
          <p style="margin:0 auto 18px;max-width:620px;color:#d8dee8;">
            En produccion esta ruta sirve la misma app operativa sin cambiar la URL. Si ves este respaldo, usa el acceso directo.
          </p>
          <a class="button primary" href="https://tareascontrol.netlify.app/">Entrar al sistema</a>
        </div>
      </section>
    </main>
  </body>
</html>
