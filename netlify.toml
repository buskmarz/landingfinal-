[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  external_node_modules = ["@netlify/blobs"]

# Retirar documentos regulatorios y menús PDF obsoletos del acceso público.
# La carta digital es la única fuente pública vigente.
[[redirects]]
  from = "/assets/coacalming.pdf"
  to = "/bienestar/"
  status = 302
  force = true

[[redirects]]
  from = "/assets/coafocus.pdf"
  to = "/bienestar/"
  status = 302
  force = true

[[redirects]]
  from = "/assets/coasleep.pdf"
  to = "/bienestar/"
  status = 302
  force = true

[[redirects]]
  from = "/assets/coawellness.pdf"
  to = "/bienestar/"
  status = 302
  force = true

[[redirects]]
  from = "/assets/menu-better-mood.pdf"
  to = "/menu/"
  status = 302
  force = true

# Sistema interno: la diagonal final evita que los assets relativos apunten a /assets/.
[[redirects]]
  from = "/sistema"
  to = "/sistema/"
  status = 301
  force = true

# El frontend vive en /sistema/ y los datos siguen saliendo del mismo backend de tareascontrol.
[[redirects]]
  from = "/sistema/"
  to = "https://tareascontrol.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/sistema/*"
  to = "https://tareascontrol.netlify.app/:splat"
  status = 200
  force = true

# 1) Cerrar el subdominio Netlify productivo sin afectar deploy previews
[[redirects]]
  from = "https://betterland.netlify.app/*"
  to = "https://bmoodcoffee.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://betterland.netlify.app/*"
  to = "https://bmoodcoffee.com/:splat"
  status = 301
  force = true

# 2) Forzar HTTPS + dominio canónico sin cadenas
[[redirects]]
  from = "http://www.bmoodcoffee.com/*"
  to = "https://bmoodcoffee.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://bmoodcoffee.com/*"
