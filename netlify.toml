[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[functions]
  external_node_modules = ["@netlify/blobs"]

# Cholula está pausada temporalmente. Conservamos las URLs históricas como
# redirecciones 302 para no romper enlaces ni declarar un cierre definitivo.
[[redirects]]
  from = "/cholula"
  to = "/cafeteria-en-la-paz-puebla/"
  status = 302
  force = true

[[redirects]]
  from = "/cholula/*"
  to = "/cafeteria-en-la-paz-puebla/"
  status = 302
  force = true

[[redirects]]
  from = "/menu-cholula"
  to = "/menu/"
  status = 302
  force = true

[[redirects]]
  from = "/menu-cholula/*"
  to = "/menu/"
  status = 302
  force = true

[[redirects]]
  from = "/preview-commons/*"
  to = "/adaptogenos-en-bebidas-puebla/"
  status = 302
  force = true

# Los archivos fuente y herramientas de SEO no son una superficie pública.
[[redirects]]
  from = "/seo/*"
  to = "/404.html"
  status = 404
  force = true

# Las rutas educativas antiguas sobre CBD se consolidan en una sola guía sencilla.
[[redirects]]
  from = "/cbd-en-el-cafe"
  to = "/cbd-en-el-cafe/"
  status = 301

[[redirects]]
  from = "/cbd-no-psicoactivo-puebla"
  to = "/cbd-en-el-cafe/"
  status = 301
  force = true

[[redirects]]
  from = "/cbd-no-psicoactivo-puebla/*"
  to = "/cbd-en-el-cafe/"
  status = 301
  force = true

# Retirar documentos regulatorios y menús PDF obsoletos del acceso público.
# La carta digital es la única fuente pública vigente.
[[redirects]]
  from = "/assets/coacalming.pdf"
  to = "/bienestar/"
  status = 301
  force = true

[[redirects]]
  from = "/assets/coafocus.pdf"
  to = "/bienestar/"
  status = 301
  force = true

[[redirects]]
