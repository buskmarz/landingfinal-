  status = 301
  force = true

[[redirects]]
  from = "/assets/menu-better-mood.pdf"
  to = "/menu/"
  status = 301
  force = true

# Módulo aislado de encuestas: se publica bajo /sistema/ sin modificar ni interceptar el POS.
[[redirects]]
  from = "/sistema/encuestas"
  to = "/sistema-encuestas/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/sistema/encuestas/"
  to = "/sistema-encuestas/index.html"
  status = 200
  force = true

# Sistema interno: Netlify normaliza /sistema a /sistema/ por el directorio local.
# El frontend vive en /sistema/ y los datos siguen saliendo del mismo backend de tareascontrol.
[[redirects]]
  from = "/sistema/"
  to = "https://tareascontrol.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/sistema/*"
  to = "https://tareascontrol.netlify.app/:splat"
  status = 200
  force = true

# 1) Cerrar el subdominio Netlify productivo sin afectar deploy previews
[[redirects]]
  from = "https://betterland.netlify.app/*"
  to = "https://bmoodcoffee.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://betterland.netlify.app/*"
  to = "https://bmoodcoffee.com/:splat"
  status = 301
  force = true

# 2) Forzar HTTPS + dominio canónico sin cadenas
[[redirects]]
